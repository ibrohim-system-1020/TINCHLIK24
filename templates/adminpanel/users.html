{% extends "base.html" %}

{% block content %}
<h1>Users</h1>
<table>
  <tr><th>Username</th><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th>Listings</th></tr>
  {% for u in users %}
    <tr>
      <td>{{ u.username }}</td>
      <td>{{ u.get_full_name }}</td>
      <td>{{ u.email }}</td>
      <td>{{ u.telefon }}</td>
      <td>{{ u.date_joined }}</td>
      <td>{{ u.listing_count }}</td>
    </tr>
  {% endfor %}
</table>
{% endblock %}
