{% extends 'base.html' %}

{% block content %}
<div class="auth-overlay active" style="position: relative; display: flex; min-height: 100vh; background: #f5f7fb;">
  <div class="auth-modal">
    <div class="auth-header">
      <div class="auth-logo">T</div>
      <h2>Tasdiqlash kodi</h2>
      <p>Telegram botdan kelgan 6 xonali kodni kiriting.</p>
    </div>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="input-box">
        {{ form.code.label_tag }}
        {{ form.code }}
        {{ form.code.errors }}
      </div>
      <button type="submit" class="auth-submit">TASDIQLASH</button>
    </form>
  </div>
</div>
{% endblock %}
